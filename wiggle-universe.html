<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory Fresh Game - Wiggle Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            touch-action: none; /* Prevenir zoom y scroll en móviles */
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .game-title {
            font-size: 2em;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        
        .game-stats {
            display: flex;
            gap: 30px;
        }
        
        .stat {
            text-align: center;
            color: white;
        }
        
        .stat-label {
            font-size: 0.8em;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        .game-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            pointer-events: all;
        }
        
        .btn {
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #e91e63, #ff4081);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(233, 30, 99, 0.4);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(233, 30, 99, 0.6);
        }
        
        .btn:active {
            transform: translateY(-1px);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.95), rgba(46, 20, 80, 0.95));
            padding: 40px;
            border-radius: 20px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            z-index: 1000;
            pointer-events: all;
            backdrop-filter: blur(20px);
        }
        
        .modal.active {
            display: block;
            animation: modalAppear 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        @keyframes modalAppear {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        
        .modal h2 {
            font-size: 3em;
            color: #ffc107;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 193, 7, 0.5);
        }
        
        .modal p {
            font-size: 1.5em;
            color: white;
            margin: 10px 0;
        }
        
        .modal-stats {
            margin: 30px 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 2em;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            z-index: 2000;
        }
        
        /* Responsive para dispositivos móviles */
        @media (max-width: 768px) {
            .game-title {
                font-size: 1.2em;
            }
            
            .game-header {
                padding: 10px;
                flex-direction: column;
                gap: 10px;
            }
            
            .game-stats {
                gap: 15px;
                width: 100%;
                justify-content: space-around;
            }
            
            .stat-label {
                font-size: 0.6em;
            }
            
            .stat-value {
                font-size: 1.2em;
            }
            
            .game-controls {
                bottom: 20px;
                gap: 10px;
                flex-wrap: wrap;
                padding: 0 10px;
            }
            
            .btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }
            
            .modal {
                width: 90%;
                max-width: 350px;
                padding: 20px;
            }
            
            .modal h2 {
                font-size: 2em;
            }
            
            .modal p {
                font-size: 1.1em;
            }
            
            .loading {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-overlay">
        <div class="game-header">
            <div class="game-title">🍓 Memory Fresh 🍓</div>
            <div class="game-stats">
                <div class="stat">
                    <div class="stat-label">Puntos</div>
                    <div class="stat-value" id="score">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Movimientos</div>
                    <div class="stat-value" id="moves">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Tiempo</div>
                    <div class="stat-value" id="timer">0:00</div>
                </div>
            </div>
        </div>
        
        <div class="game-controls">
            <button class="btn" onclick="resetGame()">🔄 Reiniciar</button>
            <button class="btn" onclick="window.location.href='index.html'">🏠 Inicio</button>
        </div>
        
        <div id="win-modal" class="modal">
            <h2>🎉 ¡GANASTE! 🎉</h2>
            <div class="modal-stats">
                <p>⭐ Puntos: <span id="final-score">0</span></p>
                <p>🎯 Movimientos: <span id="final-moves">0</span></p>
                <p>⏱️ Tiempo: <span id="final-time">0:00</span></p>
            </div>
            <button class="btn" onclick="resetGame()">Jugar de Nuevo</button>
        </div>
    </div>
    
    <div class="loading" id="loading">Cargando...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game variables
        let scene, camera, renderer, raycaster, mouse;
        let cardMeshes = [];
        let cardData = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let score = 0;
        let startTime;
        let timerInterval;
        let isProcessing = false;
        
        // Fruit emojis for the game
        const fruits = ['🍓', '🍒', '🍑', '🍊', '🍋', '🍌', '🍉', '🍇', '🍈'];
        
        // Create pairs of fruits
        const createCardPairs = () => {
            const pairs = [...fruits, ...fruits];
            return pairs.sort(() => Math.random() - 0.5);
        };
        
        // Initialize Three.js scene
        function initThreeJS() {
            // Scene setup
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x667eea, 10, 50);
            
            // Detectar si es móvil
            const isMobile = window.innerWidth <= 768;
            
            // Camera setup - ajustado para móviles
            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.PerspectiveCamera(50, aspect, 0.1, 1000);
            
            // Posición de cámara ajustada según el dispositivo
            if (isMobile) {
                camera.position.set(0, 0, 32); // Mucho más lejos en móviles
            } else {
                camera.position.set(0, 0, 18); // Posición normal en desktop
            }
            
            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // Raycaster for click detection
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, isMobile ? 0.7 : 0.5);
            scene.add(ambientLight);
            
            const pointLight1 = new THREE.PointLight(0xe91e63, isMobile ? 1.5 : 2, 50);
            pointLight1.position.set(5, 5, 5);
            scene.add(pointLight1);
            
            const pointLight2 = new THREE.PointLight(0xffc107, isMobile ? 1.5 : 2, 50);
            pointLight2.position.set(-5, -5, 5);
            scene.add(pointLight2);
            
            const pointLight3 = new THREE.PointLight(0x00bcd4, isMobile ? 1.5 : 2, 50);
            pointLight3.position.set(0, 5, -5);
            scene.add(pointLight3);
            
            // Add particle background
            createParticles();
            
            // Create cards
            createCards();
            
            // Event listeners
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('click', onCardClick);
            renderer.domElement.addEventListener('touchend', onCardClick); // Para móviles
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('touchmove', onTouchMove); // Para móviles
            
            // Hide loading
            document.getElementById('loading').style.display = 'none';
            
            // Start timer
            startTimer();
            
            // Start animation loop
            animate();
        }
        
        // Create particle background
        function createParticles() {
            const particleGeometry = new THREE.BufferGeometry();
            const particleCount = 1000;
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 50;
                positions[i + 1] = (Math.random() - 0.5) * 50;
                positions[i + 2] = (Math.random() - 0.5) * 50;
                
                const color = new THREE.Color();
                color.setHSL(Math.random(), 0.7, 0.6);
                colors[i] = color.r;
                colors[i + 1] = color.g;
                colors[i + 2] = color.b;
            }
            
            particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const particleMaterial = new THREE.PointsMaterial({
                size: 0.1,
                vertexColors: true,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });
            
            const particles = new THREE.Points(particleGeometry, particleMaterial);
            particles.name = 'particles';
            scene.add(particles);
        }
        
        // Create game cards
        function createCards() {
            const shuffledFruits = createCardPairs();
            
            // Detectar si es móvil
            const isMobile = window.innerWidth <= 768;
            
            // Layout ajustado según dispositivo
            const cols = isMobile ? 3 : 6; // 3 columnas en móvil, 6 en desktop
            const rows = isMobile ? 6 : 3; // 6 filas en móvil, 3 en desktop
            const spacing = isMobile ? 2.0 : 2.5; // Menos espacio en móvil
            
            const startX = -(cols - 1) * spacing / 2;
            const startY = (rows - 1) * spacing / 2;
            
            shuffledFruits.forEach((fruit, index) => {
                const col = index % cols;
                const row = Math.floor(index / cols);
                
                const x = startX + col * spacing;
                const y = startY - row * spacing;
                
                const card = createCard(fruit, x, y, index, isMobile);
                cardMeshes.push(card);
                cardData.push({
                    fruit: fruit,
                    flipped: false,
                    matched: false,
                    mesh: card,
                    targetRotation: 0,
                    currentRotation: 0
                });
                scene.add(card);
                
                // Entrance animation
                card.scale.set(0, 0, 0);
                card.rotation.y = Math.PI;
                animateCardEntrance(card, index);
            });
        }
        
        // Create a single card
        function createCard(emoji, x, y, index, isMobile = false) {
            // Tamaño de carta ajustado para móviles - más pequeñas
            const cardWidth = isMobile ? 1.8 : 2;
            const cardHeight = isMobile ? 2.5 : 2.8;
            const geometry = new THREE.BoxGeometry(cardWidth, cardHeight, 0.1);
            
            // Create materials for each face
            const sideMaterial = new THREE.MeshPhongMaterial({
                color: 0x764ba2,
                shininess: 100
            });
            
            // Tamaño de canvas y fuente ajustado para móviles
            const canvasSize = isMobile ? 512 : 256; // Mayor resolución en móvil
            const questionFontSize = isMobile ? 240 : 120;
            const emojiFontSize = isMobile ? 360 : 180;
            
            // Front face (question mark)
            const frontCanvas = document.createElement('canvas');
            frontCanvas.width = canvasSize;
            frontCanvas.height = canvasSize;
            const frontCtx = frontCanvas.getContext('2d');
            
            // Gradient background
            const gradient = frontCtx.createLinearGradient(0, 0, canvasSize, canvasSize);
            gradient.addColorStop(0, '#e91e63');
            gradient.addColorStop(1, '#ff4081');
            frontCtx.fillStyle = gradient;
            frontCtx.fillRect(0, 0, canvasSize, canvasSize);
            
            // Question mark
            frontCtx.fillStyle = 'white';
            frontCtx.font = `bold ${questionFontSize}px Arial`;
            frontCtx.textAlign = 'center';
            frontCtx.textBaseline = 'middle';
            frontCtx.fillText('?', canvasSize / 2, canvasSize / 2);
            
            const frontTexture = new THREE.CanvasTexture(frontCanvas);
            const frontMaterial = new THREE.MeshPhongMaterial({ map: frontTexture });
            
            // Back face (emoji)
            const backCanvas = document.createElement('canvas');
            backCanvas.width = canvasSize;
            backCanvas.height = canvasSize;
            const backCtx = backCanvas.getContext('2d');
            
            // Gradient background
            const backGradient = backCtx.createLinearGradient(0, 0, canvasSize, canvasSize);
            backGradient.addColorStop(0, '#667eea');
            backGradient.addColorStop(1, '#764ba2');
            backCtx.fillStyle = backGradient;
            backCtx.fillRect(0, 0, canvasSize, canvasSize);
            
            // Emoji con mejor renderizado
            backCtx.font = `bold ${emojiFontSize}px Arial`;
            backCtx.textAlign = 'center';
            backCtx.textBaseline = 'middle';
            backCtx.fillText(emoji, canvasSize / 2, canvasSize / 2);
            
            const backTexture = new THREE.CanvasTexture(backCanvas);
            const backMaterial = new THREE.MeshPhongMaterial({ map: backTexture });
            
            // Array of materials: right, left, top, bottom, front, back
            const materials = [
                sideMaterial,
                sideMaterial,
                sideMaterial,
                sideMaterial,
                frontMaterial,
                backMaterial
            ];
            
            const cardMesh = new THREE.Mesh(geometry, materials);
            cardMesh.position.set(x, y, 0);
            cardMesh.castShadow = true;
            cardMesh.receiveShadow = true;
            cardMesh.userData = { index: index };
            
            return cardMesh;
        }
        
        // Animate card entrance
        function animateCardEntrance(card, index) {
            const delay = index * 50;
            setTimeout(() => {
                const duration = 800;
                const startTime = Date.now();
                
                function animate() {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 3); // Ease out cubic
                    
                    card.scale.setScalar(eased);
                    card.rotation.y = Math.PI * (1 - eased);
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    }
                }
                animate();
            }, delay);
        }
        
        // Handle card click
        function onCardClick(event) {
            if (isProcessing) return;
            
            // Manejar tanto eventos de mouse como táctiles
            let clientX, clientY;
            
            if (event.type === 'touchend' && event.changedTouches) {
                event.preventDefault(); // Prevenir doble click en móviles
                clientX = event.changedTouches[0].clientX;
                clientY = event.changedTouches[0].clientY;
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }
            
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cardMeshes, true);
            
            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                const index = clickedMesh.userData.index;
                flipCard(index);
            }
        }
        
        // Handle mouse move for hover effect
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cardMeshes, true);
            
            cardMeshes.forEach((card, index) => {
                if (!cardData[index].flipped && !cardData[index].matched) {
                    card.position.z = 0;
                }
            });
            
            if (intersects.length > 0) {
                const hoveredMesh = intersects[0].object;
                const index = hoveredMesh.userData.index;
                if (!cardData[index].flipped && !cardData[index].matched) {
                    hoveredMesh.position.z = 0.5;
                }
            }
        }
        
        // Handle touch move for mobile
        function onTouchMove(event) {
            if (event.touches.length > 0) {
                const touch = event.touches[0];
                mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;
            }
        }
        
        // Flip card
        function flipCard(index) {
            const card = cardData[index];
            
            if (card.flipped || card.matched || flippedCards.length >= 2) {
                return;
            }
            
            card.flipped = true;
            card.targetRotation = Math.PI;
            flippedCards.push(index);
            
            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;
                setTimeout(checkMatch, 600);
            }
        }
        
        // Check if cards match
        function checkMatch() {
            isProcessing = true;
            const [index1, index2] = flippedCards;
            const card1 = cardData[index1];
            const card2 = cardData[index2];
            
            if (card1.fruit === card2.fruit) {
                // Match!
                card1.matched = true;
                card2.matched = true;
                matchedPairs++;
                score += 100;
                document.getElementById('score').textContent = score;
                
                // Celebration animation
                celebrateMatch(card1.mesh, card2.mesh);
                
                if (matchedPairs === 9) {
                    setTimeout(winGame, 1000);
                }
            } else {
                // No match - flip back
                setTimeout(() => {
                    card1.flipped = false;
                    card2.flipped = false;
                    card1.targetRotation = 0;
                    card2.targetRotation = 0;
                }, 1000);
            }
            
            flippedCards = [];
            setTimeout(() => {
                isProcessing = false;
            }, 1000);
        }
        
        // Celebrate match animation
        function celebrateMatch(mesh1, mesh2) {
            const duration = 500;
            const startTime = Date.now();
            
            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const scale = 1 + Math.sin(progress * Math.PI) * 0.2;
                
                mesh1.scale.set(scale, scale, 1);
                mesh2.scale.set(scale, scale, 1);
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }
            animate();
        }
        
        // Win game
        function winGame() {
            clearInterval(timerInterval);
            
            document.getElementById('final-score').textContent = score;
            document.getElementById('final-moves').textContent = moves;
            document.getElementById('final-time').textContent = document.getElementById('timer').textContent;
            
            document.getElementById('win-modal').classList.add('active');
            
            // Confetti effect
            createConfetti();
        }
        
        // Create confetti
        function createConfetti() {
            const confettiCount = 200;
            const confettiGeometry = new THREE.BufferGeometry();
            const positions = new Float32Array(confettiCount * 3);
            const colors = new Float32Array(confettiCount * 3);
            const velocities = [];
            
            for (let i = 0; i < confettiCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 20;
                positions[i * 3 + 1] = Math.random() * 10 + 5;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 5;
                
                const color = new THREE.Color();
                color.setHSL(Math.random(), 1, 0.6);
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
                
                velocities.push({
                    x: (Math.random() - 0.5) * 0.1,
                    y: -0.05 - Math.random() * 0.05,
                    z: (Math.random() - 0.5) * 0.1
                });
            }
            
            confettiGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            confettiGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const confettiMaterial = new THREE.PointsMaterial({
                size: 0.3,
                vertexColors: true,
                transparent: true,
                opacity: 1
            });
            
            const confetti = new THREE.Points(confettiGeometry, confettiMaterial);
            confetti.name = 'confetti';
            scene.add(confetti);
            
            // Animate confetti
            function animateConfetti() {
                const positions = confetti.geometry.attributes.position.array;
                
                for (let i = 0; i < confettiCount; i++) {
                    positions[i * 3] += velocities[i].x;
                    positions[i * 3 + 1] += velocities[i].y;
                    positions[i * 3 + 2] += velocities[i].z;
                    
                    if (positions[i * 3 + 1] < -10) {
                        scene.remove(confetti);
                        return;
                    }
                }
                
                confetti.geometry.attributes.position.needsUpdate = true;
                requestAnimationFrame(animateConfetti);
            }
            animateConfetti();
        }
        
        // Start timer
        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                document.getElementById('timer').textContent = 
                    `${minutes}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }
        
        // Reset game
        function resetGame() {
            // Remove all cards and particles
            cardMeshes.forEach(card => scene.remove(card));
            const particles = scene.getObjectByName('particles');
            if (particles) scene.remove(particles);
            const confetti = scene.getObjectByName('confetti');
            if (confetti) scene.remove(confetti);
            
            // Reset variables
            cardMeshes = [];
            cardData = [];
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            score = 0;
            isProcessing = false;
            
            // Reset UI
            document.getElementById('score').textContent = '0';
            document.getElementById('moves').textContent = '0';
            document.getElementById('timer').textContent = '0:00';
            document.getElementById('win-modal').classList.remove('active');
            
            // Clear timer
            if (timerInterval) clearInterval(timerInterval);
            
            // Recreate game
            createParticles();
            createCards();
            startTimer();
        }
        
        // Window resize handler
        function onWindowResize() {
            const isMobile = window.innerWidth <= 768;
            
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            // Ajustar posición de cámara según el dispositivo
            if (isMobile) {
                camera.position.z = 32; // Mucho más lejos en móviles
            } else {
                camera.position.z = 18; // Posición normal en desktop
            }
        }
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            const time = Date.now() * 0.001;
            
            // Rotate particles
            const particles = scene.getObjectByName('particles');
            if (particles) {
                particles.rotation.y = time * 0.05;
            }
            
            // Update card rotations and wiggle
            cardData.forEach((card, index) => {
                // Smooth rotation animation
                card.currentRotation += (card.targetRotation - card.currentRotation) * 0.1;
                card.mesh.rotation.y = card.currentRotation;
                
                // Wiggle effect for non-matched cards
                if (!card.matched && !card.flipped) {
                    card.mesh.rotation.z = Math.sin(time * 2 + index * 0.5) * 0.02;
                }
            });
            
            // Animate lights
            const lights = scene.children.filter(child => child instanceof THREE.PointLight);
            lights.forEach((light, index) => {
                const radius = 10;
                const speed = 0.5 + index * 0.2;
                light.position.x = Math.cos(time * speed + index * 2) * radius;
                light.position.z = Math.sin(time * speed + index * 2) * radius;
            });
            
            renderer.render(scene, camera);
        }
        
        // Initialize game when page loads
        window.addEventListener('load', initThreeJS);
    </script>
</body>
</html>
